[project]
name = "helix-api"
version = "0.1.0"
description = "HelixAI FastAPI application"
authors = [
    { name = "Ebunwadi", email = "111129501+Ebunwadi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
helix-api = "helix_api.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
