[project]
name = "helix-api"
version = "0.4.0"
description = "HelixAI FastAPI application"
authors = [
    { name = "Ebunwadi", email = "111129501+Ebunwadi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<2",
    "asyncpg>=0.30",
    "azure-search-documents>=12,<13",
    "azure-storage-blob[aio]>=12.27,<13",
    "fastapi>=0.115",
    "openai>=2.21,<3",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.10",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
helix-api = "helix_api.main:main"
helix-bootstrap-dev = "helix_api.dev.bootstrap:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
